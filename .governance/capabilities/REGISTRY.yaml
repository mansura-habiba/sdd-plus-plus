# Capability Registry — the continuous list.
#
# Every capability the team is building, regardless of status. Replaces the separate
# ROADMAP.md from v0.2: roadmap items live here with status: roadmap, alongside the
# active ones. Detailed specs live at the path each entry's `spec_path` points to.
#
# Validated against the registry schema bundled in the sdd tool.

capabilities:

  - id: example-feature
    name: "Example Feature"
    status: active
    owner: "@TODO-your-handle"
    one_liner: "Starter capability — rename and edit for your real first capability."
    spec_path: ".governance/capabilities/example-feature/spec.yaml"

  - id: automated-agent-harness
    name: "Automated Agent Session Harness"
    status: roadmap
    target_release: "v0.4"
    owner: "@mansura-habiba"
    one_liner: "Bootstrap governed, resumable agentic development sessions with bounded autonomy, isolated execution, evidence, leases, and auditable human override."
    spec_path: ".governance/capabilities/automated-agent-harness/spec.yaml"
    tags: [agentic-execution, automation, governance, human-override, roadmap]

  - id: mutation-testing
    name: "Mutation Testing"
    status: roadmap
    target_release: "v0.4"
    owner: "@mansura-habiba"
    one_liner: "Verify tests bound to case_ids actually assert the contract, not just touch the lines."
    spec_path: ".governance/capabilities/mutation-testing/spec.yaml"
    tags: [test-quality, ci, roadmap]

  - id: elicitation-and-escalation
    name: "Elicitation and Escalation"
    status: roadmap
    target_release: "v0.5"
    owner: "@mansura-habiba"
    one_liner: "Turn AI uncertainty and human handoff into refusable artifacts — declared triggers, blocked plans, Eve the Elicitor, anchored escalations."
    spec_path: ".governance/capabilities/elicitation-and-escalation/spec.yaml"
    tags: [ai-coordination, governance, roadmap]

