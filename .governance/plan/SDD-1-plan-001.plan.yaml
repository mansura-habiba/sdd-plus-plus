  - "Implement the `sdd harness` CLI group for init, validate, status, pause, resume, stop, takeover, and release."
  - "Implement local append-only event storage, atomic state writes, revision checks, and reconstruction of current run state."
  - "Integrate `sdd doctor`, global validation, progress evidence, and MCP read/control tools without adding plan-accept or merge authority."
  - "Add schema tests, lifecycle transition tests, override-precedence tests, init/force/dry-run tests, validation tests, and end-to-end CLI scenarios."
