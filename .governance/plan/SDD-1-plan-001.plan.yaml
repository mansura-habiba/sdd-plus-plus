challenge:
  understood_request: |
    Add a reusable SDD++ capability that lets developers bootstrap and operate automated
    agentic development sessions with bounded autonomy, persistent evidence, isolated
    execution, and limited but decisive human pause, stop, redirect, takeover, and release
    controls. The harness must coordinate existing agents rather than become another agent.
  concerns:
    - "A single first release containing scaffolding, provider process execution, GitHub issue selection, worktrees, PR automation, MCP tools, and distributed scheduling would be too broad to validate safely. The first implementation should establish contracts, scaffolding, state, and human controls before adding live provider execution."
    - "Provider CLIs and SDKs change independently. Embedding Codex- or Claude-specific command semantics in core would make the capability brittle; provider execution must be an adapter contract."
    - "Limited human override is unsafe if it is only a UI flag. Overrides must be append-only events checked before every new action, with stop/takeover taking precedence over agent progress."
    - "The repository forbids AI-authored capability contracts. A human must author and accept the capability spec and acceptance case IDs before implementation begins."
  alternatives_considered:
    - "Build a complete coding agent inside SDD++. Rejected: SDD++ should govern external agents, not reproduce their intelligence or tool loops."
    - "Generate only a GitHub Actions workflow. Rejected: workflow YAML alone does not define leases, resumability, evidence, permissions, or human override semantics."
    - "First release as scaffold + validation + session-state/control contracts + provider adapter interface, followed by execution adapters. Recommended because it creates a stable governed foundation with independently testable value."

scope:
  in_scope:
    - "Add a provider-neutral automated-agent-harness capability template for adopters."
    - "Add `sdd harness init`, `sdd harness validate`, `sdd harness status`, and human control commands for pause, resume, stop, takeover, and release."
    - "Generate `.governance/harness/` configuration, prompts, run/event/override directories, documentation, and a non-auto-merging GitHub Actions reference workflow."
    - "Define schemas and Python models for harness configuration, session state, leases, events, overrides, autonomy profiles, and provider adapter capabilities."
    - "Implement append-only local session events and deterministic state reconstruction for the reference implementation."
    - "Integrate validation, doctor output, progress evidence, and MCP read/control surfaces where appropriate."
    - "Add contract, CLI, schema, and end-to-end tests plus README and configuration documentation."
  non_goals:
    - "Do not build a new coding model or autonomous reasoning engine."
    - "Do not embed Codex, Claude Code, Cursor, or another vendor as the canonical runtime."
    - "Do not implement automatic merge, deployment, secret administration, branch-protection changes, or governance-spec authorship."
    - "Do not implement unrestricted continuous autonomy; every profile has leases, budgets, stop conditions, and human override."
    - "Do not author `.governance/capabilities/automated-agent-harness/spec.yaml`; the human owner must provide the capability contract and case IDs."

