risks:
  - "Capability case IDs are not yet available because the human-authored spec does not exist; implementation must not start until this is resolved."
  - "Concurrent sessions can corrupt leases or state if writes are not atomic and revision checked."
  - "A provider command adapter can become a shell-injection path unless arguments are structured and environment access is allowlisted."
  - "Human override may arrive while an external provider process is running; the reference runtime needs explicit acknowledgement and bounded termination semantics."
  - "Generated GitHub workflow permissions can be over-broad; the template must use least privilege and no automatic merge."
  - "Schema and MCP additions expand the public framework contract and require compatibility review."

