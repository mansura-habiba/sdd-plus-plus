notes: |
  Recommended v1 boundary:

  - scaffold and configuration;
  - schema validation;
  - lifecycle and append-only state;
  - leases and eligibility contracts;
  - human control commands;
  - provider adapter interface;
  - safe reference GitHub workflow;
  - no live provider process execution and no automatic PR creation in the core.

  Human acceptance command after authoring the capability spec:

      sdd plan accept --id SDD-1-plan-001 --by @mansura-habiba

  The learning article is useful for task graphs, autonomous claiming, team coordination,
  background work, and worktree isolation. It explicitly omits production event hooks,
  permission governance, advanced session lifecycle, and trust workflows; this plan treats
  those omissions as mandatory SDD++ responsibilities rather than optional follow-up work.
