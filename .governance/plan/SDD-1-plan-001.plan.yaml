    - "Append-only events plus deterministic projection for resumable session state."
    - "One task lease per execution lane; optimistic concurrency through expected revision."
    - "Generated artifacts are safe by default: no automatic merge, deploy, or privileged action."
    - "Small Click command group delegating implementation to `sdd.commands.harness`."
    - "Stdlib plus existing dependencies unless a human approves a new dependency."

