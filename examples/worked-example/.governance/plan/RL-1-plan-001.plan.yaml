  - reject-when-exhausted
  - tokens-never-exceed-capacity
  - refills-proportionally-over-time
  - rejects-invalid-configuration
  - rejects-invalid-token-request
  - thread-safe-concurrent-consumption

risks:
  - "Clock monotonicity: On some virtualized container platforms, time.monotonic() could experience rare sleep/wake pauses; accounted for by clamping elapsed >= 0."

