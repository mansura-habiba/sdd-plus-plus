# Capability Registry — the continuous list.
#
# Every capability the team is building, regardless of status. Replaces the separate
# ROADMAP.md from v0.2: roadmap items live here with status: roadmap, alongside the
# active ones. Detailed specs live at the path each entry's `spec_path` points to.
#
# Validated against the registry schema bundled in the sdd tool.

capabilities:

  - id: example-feature
    name: "Example Feature"
    status: active
    owner: "@TODO-your-handle"
    one_liner: "Starter capability — rename and edit for your real first capability."
    spec_path: ".governance/capabilities/example-feature/spec.yaml"

