# Schema for the YAML frontmatter of capabilities/<feature>/spec.md.
#
# Each capability is one folder with one spec.md. The frontmatter merges what used to be
# three artifacts (capability metadata + acceptance cases + DoD + NFR) into a single,
# coherent, machine-validatable block. The markdown body holds the narrative explanation.
#
# Hidden inside the sdd-plus-plus package. Adopters never see this file directly.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sdd-plus-plus/schemas/capability_spec.v1"
title: "Capability Spec (frontmatter)"
type: object
additionalProperties: false

required:
  - id
  - name
  - purpose
  - owner
  - status
  - contract
  - cases
  - definition_of_done
  - forbidden

properties:

  id:
    type: string
    pattern: "^[a-z][a-z0-9-]+[a-z0-9]$"
    description: kebab-case identifier. Matches the folder name under capabilities/.

  name:
    type: string
    maxLength: 80
    description: Human-readable name shown in dashboards and PRs.

  purpose:
    type: string
    minLength: 100
    description: |
      Why this capability exists. Minimum 100 characters of real description.
      No "TBD", no "see X", no AI-generated placeholder language.

  status:
    type: string
    enum: [active, roadmap, deprecating, retired]
    description: Lifecycle status. Roadmap items can exist without implementations yet.

  tier:
    type: string
    enum: [local, team, org, regulated]
    default: team

  owner:
    type: object
    required: [human]
    additionalProperties: false
    properties:
      human:
        type: string
        pattern: "^@[a-zA-Z0-9_-]+$"
        description: |
          Human handle (e.g. @mansura). Required. AI assistants may not author or edit
          spec.md — schema enforcement is mechanical (CI checks); social enforcement
          is reviewers checking that the handle is a real person.
      backup:
        type: string
        pattern: "^@[a-zA-Z0-9_-]+$"

  # -------------------------------------------------------------------------
  # Contract — the stable interface
  # -------------------------------------------------------------------------

  contract:
    type: object
    required: [inputs, outputs]
    additionalProperties: false
    properties:
      inputs:
        type: array
        items:
          type: object
          required: [name, shape]
          additionalProperties: false
          properties:
            name: { type: string }
            shape: { type: string }
            description: { type: string }
      outputs:
        type: array
        items:
          type: object
          required: [name, shape]
          additionalProperties: false
          properties:
            name: { type: string }
            shape: { type: string }
            description: { type: string }
      invariants:
        type: array
        items: { type: string }

  # -------------------------------------------------------------------------
  # Acceptance cases — was acceptance.yaml in v0.2
  # -------------------------------------------------------------------------

  cases:
    type: array
    minItems: 1
    description: |
      Test cases the implementation must satisfy. AI writes test code against these case IDs;
      AI may not author the cases themselves.
    items:
      type: object
      required: [id, kind, description]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]+[a-z0-9]$"
        kind:
          type: string
          enum:
            - positive
            - negative
            - invariant
            - boundary
            - regression
            - performance
            - security
            - idempotence
        priority:
          type: string
          enum: [critical, high, normal, low]
          default: normal
        description:
          type: string
        test_id:
          type: string
          description: "Path to the test, e.g. tests/contract/test_x.py::test_y"
        forbidden_implementations:
          type: array
          items: { type: string }

  # -------------------------------------------------------------------------
  # Definition of Done — binary
  # -------------------------------------------------------------------------

  definition_of_done:
    type: object
    required: [conditions]
    additionalProperties: false
    properties:
      conditions:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, statement, verifiable_by]
          additionalProperties: false
          properties:
            id: { type: string, pattern: "^[a-z][a-z0-9-]+[a-z0-9]$" }
            statement: { type: string }
            verifiable_by:
              type: string
              enum:
                - contract_test
                - metric_threshold
                - manual_check
                - schema_validation
                - mutation_score
            evidence_ref: { type: string }

  # -------------------------------------------------------------------------
  # Non-functional requirements
  # -------------------------------------------------------------------------

  non_functional:
    type: object
    additionalProperties: false
    properties:
      performance: { type: string }
      security: { type: string }
      observability: { type: string }
      compatibility: { type: string }

  # -------------------------------------------------------------------------
  # Bounded authority for tasks within this capability
  # -------------------------------------------------------------------------

  tasks_must:
    type: object
    additionalProperties: false
    properties:
      pass_contract_tests:
        type: array
        items: { type: string }
      use_patterns:
        type: array
        items: { type: string }
      avoid_dependencies:
        type: array
        items: { type: string }

  forbidden:
    type: array
    minItems: 1
    items: { type: string }
    description: |
      Behaviors NO task within this capability does. At least one entry — capabilities
      without explicit limits are anti-patterns. This is the spec-level equivalent of
      a plan's non_goals.

  related_capabilities:
    type: array
    items: { type: string }

  # -------------------------------------------------------------------------
  # Narrative — free-form text for design rationale that doesn't fit elsewhere
  # -------------------------------------------------------------------------

  notes:
    type: object
    description: |
      Free-form narrative fields. Optional, but useful for design rationale, open questions,
      and architectural context that doesn't fit in the structured sections above. Multi-line
      strings welcome.
    additionalProperties: false
    properties:
      design_rationale:
        type: string
        description: Why this capability is shaped the way it is. Architectural choices.
      open_questions:
        type: string
        description: Things you're not yet sure about. Pin them here so they don't get lost.
      related_findings_notes:
        type: string
        description: Free text about findings that affect this capability beyond what auto-surfaces.
